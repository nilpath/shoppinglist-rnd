ingredients:
  - name: Fetaost
    quantity: 300
    unit: g
  - name: Ägg
    quantity: 1
    unit: st
  - name: vetemjöl
    quantity: 3
    unit: msk
  - name: olivolja
    quantity: 1
    unit: msk
  - name: cayennepeppar
    quantity: 2
    unit: krm
  - name: ströbröd
    quantity: 1
    unit: dl
  - name: potatis
    quantity: 800
    unit: g
  - name: gräddfil
    quantity: 2
    unit: dl
  - name: gräslök
    quantity: 1
    unit: st
steps:
  - Sätt ugnen på 200 grader. Klyfta potatisen och lägg på en plåt med bakplåtspapper. Ringla över lite olivolja och salta. Rosta i ugnen cirka 30 minuter.
  - Smula ner fetaosten och rör ihop allting förutom ströbröd till en smet. 
  - Häll ut ströbröd på en tallrik. Gör 8 biffar av fetaostsmeten och vänd runt dem i ströbrödet. 
  - Stek i olja cirka 4 minuter på varje sida.
  - Blanda gräddfil med finhackad gräslök och servera till fetaostbiffarna tillsammans klyftad potatis.
