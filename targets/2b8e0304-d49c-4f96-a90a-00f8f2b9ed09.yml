steps:
  - Skär kycklingen i mindre bitar. Strimla paprikan. Hacka lök och vitlök.
  - Fräs lök och vitlök o olja. Tillsätt kycklingen. Fräs några minuter.
  - Tillsätt grön curry och fräs lite till. Tillsätt kokosmjölk. Koka 20 minuter.
  - Tillsätt haricot vertes och paprika och koka 5 minuter till.
  - Servera med ris. Garnera med thaibasilika.
