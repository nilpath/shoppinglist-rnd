---
name: Krämig kycklingpasta med soltorkade tomater
url: https://www.tasteline.com/recept/kramig-kycklingpasta-med-soltorkade-tomater/
image: https://eu-central-1.linodeobjects.com/tasteline/2019/08/kramig-kycklingpasta-med-soltorkad-tomat-foto-nurlan-emir-mathem.jpg
level_of_difficulty: medium
time: 30
portion: 4
tags: 
  - Huvudrätt
  - Kyckling
  - Asiatiskt
  - Vardagsmat
ingredients:
  - name: tagliatelle
    quantity: 400
    unit: g
  - name: vitlöksklyftor
    quantity: 2
    unit: st
  - name: Kycklingfilé
    quantity: 600
    unit: g
  - name: soltorkade tomater
    quantity: 140
    unit: g
  - name: olivolja
    quantity: 1
    unit: msk
  - name: torkad basilika
    quantity: 0.5
    unit: tsk
  - name: kycklingfond
    quantity: 1
    unit: msk
  - name: vispgrädde
    quantity: 2.5
    unit: dl
  - name: salt
    quantity: 1
    unit: krm
  - name: svartpeppar
    quantity: 1
    unit: krm
  - name: parmesanost
    quantity: 100
    unit: g
steps:
  - Koka pastan efter anvisning på paketet.
  - Skala och riv vitlök. Strimla kycklingen och de soltorkade tomaterna.
  - Hetta upp en stor stekpanna med olja och bryn lök, vitlök, kyckling och basilika till en fin stekyta. Tillsätt soltorkade tomater och stek ihop.
  - Tillsätt fond, grädde och ½ dl av pastavattnet och låt det koka ihop i 4-5 minuter. Smaka av med salt och peppar.
  - Sila av pastan och blanda med kycklingsåsen. Vänd ner finriven parmesanost och servera meddetsamma.
