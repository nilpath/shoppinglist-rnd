    quantity: 1
    unit: st
  - name: röd paprika
    quantity: 1
    unit: st
  - name: vitlöksklyftor
    quantity: 2
    unit: st
  - name: krossade tomater
    quantity: 500
    unit: g
  - name: vatten
    quantity: 3
    unit: dl
  - name: röda linser
    quantity: 3
    unit: dl
  - name: creme fraiche
    quantity: 2
    unit: dl
  - name: tortilliabröd (stora)
    quantity: 4
    unit: st
  - name: riven ost
    quantity: 200
    unit: g
  - name: salt
    quantity: 1
    unit: tsk
  - name: mixsallad
    quantity: 1
    unit: st
steps:
  - Sätt ugnen på 200°. Hetta upp olja i en rymlig stekpanna och stek lök, vitlök, paprika och tacokrydda ca 3 min.
  - Tillsätt krossade tomater, vatten och linser. Salta och låt koka upp. Koka linserna mjuka, 5-10 minuter. Rör ner crème fraiche och ta pannan från värmen.
  - Varva tortillabröd och linsröra i en rund ugnssäker form, ca 24 cm i diameter. Toppa med riven ost och gratinera mitt i ugnen 25-30 min.
  - Servera med grönsallad.
